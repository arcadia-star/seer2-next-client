# https://github.com/marketplace/actions/electron-builder-action

name: Build/release

on:
  workflow_dispatch:        # 允许手动触发
  push:
    branches:
      - 'main'
      - 'master'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]   # 同时构建 Windows 和 macOS 版本

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 21

      - name: Install pnpm and dependencies
        run: |
          npm install -g pnpm@latest-10
          pnpm install

      - name: Build and release Electron app
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.SEER2_NEXT_CLIENT_RELEASE_GH_TOKEN }}
          # 跳过 macOS 代码签名（如果没有 Apple 开发者证书）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 可选：将构建产物作为工作流 artifacts 保留（便于调试，不会影响 GitHub Release）
      - name: Upload Windows x64 installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: seer2-next-client-Setup-x64.exe.zip
          path: dist/*-x64.exe

      - name: Upload Windows ia32 installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: seer2-next-client-Setup-ia32.exe.zip
          path: dist/*-ia32.exe

      - name: Upload macOS x64 installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: seer2-next-client-Setup-x64.dmg.zip
          path: dist/*-x64.dmg

      - name: Upload macOS arm64 installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: seer2-next-client-Setup-arm64.dmg.zip
          path: dist/*-arm64.dmg
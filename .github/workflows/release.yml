# https://github.com/marketplace/actions/electron-builder-action

name: Build/release

on:
  workflow_dispatch:        # 手动触发
  push:
    branches:
      - 'main'
      - 'master'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]   # ✅ 添加 macOS runner

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 21

      - name: Build/release Electron app
        run: npm install -g pnpm@latest-10 && pnpm i && pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.SEER2_NEXT_CLIENT_RELEASE_GH_TOKEN }}
          # 如果不需要代码签名，可以添加下面这行避免因找不到证书而报错
          CSC_IDENTITY_AUTO_DISCOVERY: false

<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>seer2</title>
        <script src="http://ruffle.localhost/ruffle/ruffle-webview-init.js"></script>
        <script type="module" src="/main.ts"></script>
    </head>
    <body>
        <main class="game-stage" aria-label="seer2 game">
            <embed src="http://seer2.localhost/seer2/Client.swf"

                   quality="high"
                   wmode="opaque"

                   height="660"
                   allowFullScreen="true"
                   allowScriptAccess="always"
                   bgcolor="#000000"
                   scale="showall"
                   pluginspage="https://www.adobe.com/go/getflashplayer"
                   class="flash-game">

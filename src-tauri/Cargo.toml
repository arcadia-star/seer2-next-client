[package]
name = "seer2-next-client-tauri"
version = "1.1.4"
description = "seer2"
authors = ["ukuq"]
license = "MIT"
edition = "2021"

[lib]
name = "seer2_next_client_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
